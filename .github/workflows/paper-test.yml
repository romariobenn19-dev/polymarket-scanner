name: Paper test (rewards bots A/F, arbitrage watch)

# Starts automatically every 6 hours (also manually: Actions > Paper test > Run workflow).
# To stop the automatic runs: Actions > Paper test > ... > Disable workflow.
# Paper mode only: no keys, no orders.
# Each run resumes the saved results from the paper-results branch, runs for `hours`
# and saves again. Start the next run when one finishes; results carry over.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours per run (max ~5.7)'
        default: '5.5'

permissions:
  contents: write

concurrency:
  group: paper-test
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests websockets

      - name: Restore saved results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if git fetch -q origin paper-results; then
            git worktree add -q ../pm-results paper-results
            cp ../pm-results/paper_*.db . 2>/dev/null || true
          else
            git worktree add -q --orphan -b paper-results ../pm-results
          fi
          ls -la paper_*.db 2>/dev/null || echo "starting fresh"

      - name: Run versions A, F ($50/$100/$200/$500) and the arbitrage watch
        env:
          HOURS: ${{ inputs.hours || '5.5' }}
        run: |
          python3 rewards_bot.py run --hours "$HOURS" --db paper_A.db > paper_A.log 2>&1 & A=$!
          python3 rewards_bot_f.py run --hours "$HOURS" --db paper_F.db > paper_F.log 2>&1 & F=$!
          python3 rewards_bot_f.py run --hours "$HOURS" --db paper_F100.db --budget 100 > paper_F100.log 2>&1 & F100=$!
          python3 rewards_bot_f.py run --hours "$HOURS" --db paper_F200.db --budget 200 > paper_F200.log 2>&1 & F200=$!
          python3 rewards_bot_f.py run --hours "$HOURS" --db paper_F500.db --budget 500 > paper_F500.log 2>&1 & F500=$!
          python3 arb_watch.py run --hours "$HOURS" --db paper_ARB.db > paper_ARB.log 2>&1 & ARB=$!
          python3 saver.py > saver.log 2>&1 & S=$!
          wait $A $F $F100 $F200 $F500 $ARB || true
          kill $S 2>/dev/null || true
          tail -n 3 paper_*.log

      - name: Save results
        if: always()
        run: |
          python3 saver.py --once
          python3 compare.py >> "$GITHUB_STEP_SUMMARY"
          python3 arb_watch.py report --db paper_ARB.db >> "$GITHUB_STEP_SUMMARY" || true
